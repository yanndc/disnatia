services:
  postgres:
    image: postgres:16-alpine
    container_name: disnatia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: disnatia
    ports:
      - "5433:5432"
    volumes:
      - disnatia-postgres:/var/lib/postgresql/data

volumes:
  disnatia-postgres:
