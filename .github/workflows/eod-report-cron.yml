# Déclenche le rapport fin de journée sur l’app Vercel (évite la limite Vercel Cron).
# Idempotence en base (un envoi par séance) ; horaire fixé par ce cron GitHub.
name: Rapport EOD

on:
  schedule:
    # Après backfill-market-history (22 h 15 UTC) ; ≈ 18 h 45 Toronto (EST/EDT)
    - cron: "45 22 * * 1-5"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/eod-report
        env:
          APP_URL: ${{ vars.EOD_REPORT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Config manquante : vars.EOD_REPORT_APP_URL (Variables) et secrets.CRON_SECRET (Secrets)"
            exit 1
          fi
          BASE="${APP_URL%/}"
          echo "Appel ${BASE}/api/cron/eod-report"
          HTTP_CODE=$(curl -sS -o /tmp/eod-response.json -w "%{http_code}" \
            -X POST "${BASE}/api/cron/eod-report" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          cat /tmp/eod-response.json
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Échec HTTP ${HTTP_CODE}"
            exit 1
          fi
