# Ingestion du fil de nouvelles d'investissement (RSS/Atom → base + scoring portefeuille).
# Déclenche POST /api/cron/refresh-news sur l'app Vercel ; idempotent (URL canonique + empreinte).
name: Fil de nouvelles

on:
  schedule:
    # Toutes les 30 min entre 11 h et 23 h UTC (≈ 7 h – 19 h Toronto) en semaine.
    - cron: "*/30 11-23 * * 1-5"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/refresh-news
        env:
          APP_URL: ${{ vars.EOD_REPORT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Config manquante : vars.EOD_REPORT_APP_URL (Variables) et secrets.CRON_SECRET (Secrets)"
            exit 1
          fi
          BASE="${APP_URL%/}"
          echo "Appel ${BASE}/api/cron/refresh-news"
          HTTP_CODE=$(curl -sS -o /tmp/news-response.json -w "%{http_code}" \
            -X POST "${BASE}/api/cron/refresh-news" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          cat /tmp/news-response.json
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Échec HTTP ${HTTP_CODE}"
            exit 1
          fi
