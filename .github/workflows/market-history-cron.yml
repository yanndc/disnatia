# Complète portfolio_daily_prices (clôtures Yahoo) après la clôture TSX/NYSE.
name: Historique clôtures

on:
  schedule:
    # Lun–ven 23 h 15 UTC ≈ 18 h 15–19 h Toronto (après le rapport EOD 22 h 30 UTC)
    # Avant le rapport EOD (22 h 45 UTC) pour alimenter portfolio_daily_values.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer la fenêtre horaire et forcer le backfill Yahoo"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/backfill-market-history
        env:
          APP_URL: ${{ vars.EOD_REPORT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'true' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Config manquante : vars.EOD_REPORT_APP_URL (Variables) et secrets.CRON_SECRET (Secrets)"
            exit 1
          fi
          BASE="${APP_URL%/}"
          QUERY=""
          if [ "$FORCE" = "true" ]; then
            QUERY="?force=1"
          fi
          echo "Appel ${BASE}/api/cron/backfill-market-history${QUERY} (force=${FORCE})"
          HTTP_CODE=$(curl -sS -o /tmp/history-response.json -w "%{http_code}" \
            -X POST "${BASE}/api/cron/backfill-market-history${QUERY}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          cat /tmp/history-response.json
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Échec HTTP ${HTTP_CODE}"
            exit 1
          fi
